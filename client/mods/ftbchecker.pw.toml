# Self-hosted, bytecode-patched build of FTBChecker 1.3.0 - the "missing
# mods" screen's per-mod buttons overflowed the window with 7+ entries, so
# they're collapsed into a single renamed "Download all FTB missing mods"
# button. See patches/ftbchecker/README.md. Not from Modrinth, so no
# [update.modrinth] section here - `packwiz update` would silently revert
# the patch back to the stock jar.

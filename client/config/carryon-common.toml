#Common config for Carry On
# Steamon: blacklist mode. pickupAllBlocks=false -> only blocks with an inventory /
# block entity are carriable (chests, furnaces, barrels, drawers, spawners, hives,
# brewing stands...). Plain building blocks (dirt, stone, wood) are NOT carriable.
# Spawner / trial_spawner / vault / Lootr blocks are NOT blacklisted, so they stay
# carriable. All vanilla mobs (incl. boats, minecarts, hostiles) are carriable;
# entity size limits raised so big mobs work in survival.
# Cobblemon Pokemon are blacklisted (carrying them would break Cobblemon).

[settings]
	maxDistance = 2.5
	maxEntityWidth = 10.0
	maxEntityHeight = 10.0
	blockSlownessMultiplier = 1.0
	entitySlownessMultiplier = 1.0
	maxEntityStackLimit = 10
	heavyTiles = true
	pickupAllBlocks = false
	slownessInCreative = true
	pickupHostileMobs = true
	heavyEntities = true
	allowBabies = true
	useWhitelistBlocks = false
	useWhitelistEntities = false
	useWhitelistStacking = false
	hitWhileCarrying = false
	dropCarriedWhenHit = false
	useScripts = false
	stackableEntities = true
	entitySizeMattersStacking = true
	placementStateExceptions = ["minecraft:chest[type]", "minecraft:stone_button[face]", "minecraft:vine[north,east,south,west,up]", "minecraft:creeper_head[rotation]", "minecraft:glow_lichen[north,east,south,west,up,down]", "minecraft:oak_sign[rotation]", "minecraft:oak_trapdoor[half]"]
	pickupPlayers = true
	pickupUnbreakableBlocks = false

[whitelist]
	allowedEntities = []
	allowedBlocks = []
	allowedStacking = []

[blacklist]
	forbiddenTiles = ["#forge:immovable", "#forge:relocation_not_supported", "#neoforge:immovable", "#neoforge:relocation_not_supported", "minecraft:end_portal", "minecraft:piston_head", "#c:relocation_not_supported", "minecraft:end_gateway", "minecraft:tall_grass", "minecraft:large_fern", "minecraft:peony", "minecraft:rose_bush", "minecraft:lilac", "minecraft:sunflower", "minecraft:*_bed", "minecraft:*_door", "minecraft:big_dripleaf_stem", "minecraft:waterlily", "minecraft:cake", "minecraft:nether_portal", "minecraft:tall_seagrass", "colossalchests:*", "create:*", "create*:*", "create_enchantment_industry:*", "framedblocks:*", "securitycraft:*", "waystones:*", "ftbquests:*", "iceandfire:*", "relics:researching_table", "sophisticatedstorage:*", "functionalstorage:*", "extended_drawers:*", "farmersdelight:*", "graveyard:*", "littletiles:*", "cobblemon:display_case"]
	forbiddenEntities = ["#c:capturing_not_supported", "#c:teleporting_not_supported", "minecraft:end_crystal", "minecraft:ender_dragon", "minecraft:ghast", "minecraft:fireball", "minecraft:small_fireball", "minecraft:whither_skull", "minecraft:shulker", "minecraft:leash_knot", "minecraft:armor_stand", "minecraft:whither_skull_dangerous", "minecraft:dragon_fireball", "minecraft:item_frame", "minecraft:painting", "minecraft:shulker_bullet", "minecraft:evoker_fangs", "minecraft:glow_item_frame", "minecraft:tnt", "minecraft:trident", "minecraft:arrow", "minecraft:spectral_arrow", "minecraft:interaction", "minecraft:marker", "minecraft:block_display", "minecraft:item_display", "minecraft:text_display", "pixelmon:*", "securitycraft:*", "cobblemon:pokemon"]
	forbiddenStacking = ["minecraft:horse"]

[customPickupConditions]
	customPickupConditionsBlocks = []
	customPickupConditionsEntities = []

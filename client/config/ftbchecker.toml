# Steamon - lists the CurseForge-only quest mods that the Modrinth build cannot
# ship (FTB is "All Rights Reserved"). At startup FTBChecker shows a screen with
# these mods and their download links so the player installs them manually.
# On the CurseForge build FTB is bundled and FTBChecker is removed, so the
# screen never appears.
#
# IMPORTANT: the native checks (base/quests/teams) link to the GENERIC mod page
# where players kept downloading the wrong (1.20 / 2100.x) build. We disable
# them and list every mod under [customMods] with a DIRECT file link pinned to
# the exact 1.21.1 (2101.x) version that matches the pack, so there is no way to
# grab an incompatible version.
chunks = false
base = false
quests = false
teams = false
ultimine = false
backups = false

# Direct file links pinned to the exact compatible versions (MC 1.21.1 NeoForge).
# Format: "modId|Display Name|Download URL".
[customMods]
mods = [
    "ftblibrary|FTB Library (2101.1.34)|https://www.curseforge.com/minecraft/mc-mods/ftb-library-forge/download/8519365",
    "ftbquests|FTB Quests (2101.1.28)|https://www.curseforge.com/minecraft/mc-mods/ftb-quests-forge/download/8520042",
    "ftbteams|FTB Teams (2101.1.10)|https://www.curseforge.com/minecraft/mc-mods/ftb-teams-forge/download/7878281",
    "ftbessentials|FTB Essentials (2101.1.10)|https://www.curseforge.com/minecraft/mc-mods/ftb-essentials-forge/download/8442866",
    "cobblemon_quests|Cobblemon Quests Reloaded (1.3.5)|https://www.curseforge.com/minecraft/mc-mods/cobblemon-quest-reloaded/download/7849696",
]

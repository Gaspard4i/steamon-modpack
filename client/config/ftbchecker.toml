# Steamon - lists the CurseForge-only quest mods that the Modrinth build
# cannot ship (FTB is "All Rights Reserved"). At startup FTBChecker shows a
# screen with these mods and their download links so the player installs
# them manually. On the CurseForge build FTB is bundled and FTBChecker is
# removed, so the screen never appears.
#
# FTB Quests hard-depends on FTB Teams at runtime (missing it is a hard
# crash, not a soft warning, confirmed by a real "ftbteams is not installed"
# crash during testing). All three (Library, Quests, Teams) are listed below.
#
# IMPORTANT: the native checks (base/quests/teams) link to the GENERIC mod page
# where players kept downloading the wrong (1.20 / 2100.x) build. We disable
# them and list every mod under [customMods] with a DIRECT file link pinned to
# the exact 1.21.1 (2101.x) version that matches the pack, so there is no way to
# grab an incompatible version.
chunks = false
base = false
quests = false
teams = false
essentials = false
ultimine = false
backups = false
polyLib = false

# Direct file links pinned to the exact compatible versions (MC 1.21.1 NeoForge).
# Format: "modId|Display Name|Download URL".
[customMods]
mods = [
    "ftblibrary|FTB Library (2101.1.40)|https://www.curseforge.com/minecraft/mc-mods/ftb-library-forge/download/9650381",
    "ftbquests|FTB Quests (2101.1.39)|https://www.curseforge.com/minecraft/mc-mods/ftb-quests-forge/download/9650792",
    "ftbteams|FTB Teams (2101.1.12)|https://www.curseforge.com/minecraft/mc-mods/ftb-teams-forge/download/9434081",
]

# Steamon - lists the CurseForge-only quest mods that the Modrinth build cannot
# ship (FTB is "All Rights Reserved"). At startup FTBChecker shows a screen with
# these mods and their CurseForge download links so the player installs them
# manually. On the CurseForge build FTB is bundled and FTBChecker is removed, so
# the screen never appears.
#
# Native FTB checks (built-in download links):
chunks = false
base = true
quests = true
teams = true
ultimine = false
backups = false

# Extra mods to require, format "modId|Display Name|Download URL".
# FTB Essentials is the extra FTB quest-stack mod that is CurseForge only.
[customMods]
mods = [
    "ftbessentials|FTB Essentials|https://www.curseforge.com/minecraft/mc-mods/ftb-essentials",
]

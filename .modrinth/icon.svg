<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>

  <defs>
    <clipPath id="topHalf">
      <rect x="0" y="0" width="512" height="256"/>
    </clipPath>
    <clipPath id="bottomHalf">
      <rect x="0" y="256" width="512" height="256"/>
    </clipPath>
  </defs>

  <g transform="translate(256 256)">
    <g>
      <circle r="200" fill="#ffffff" stroke="#1a1a1a" stroke-width="14"/>
      <path d="M -200 0 A 200 200 0 0 1 200 0 Z" fill="#e63946" stroke="#1a1a1a" stroke-width="14"/>
      <rect x="-200" y="-10" width="400" height="20" fill="#1a1a1a"/>
    </g>

    <g clip-path="url(#topHalf)">
      <g fill="#b08438" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round">
        <g>
          <rect x="-22" y="-200" width="44" height="50" rx="6"/>
          <rect x="-22" y="150" width="44" height="50" rx="6"/>
          <rect x="-200" y="-22" width="50" height="44" rx="6"/>
          <rect x="150" y="-22" width="50" height="44" rx="6"/>
        </g>
        <g transform="rotate(45)">
          <rect x="-22" y="-200" width="44" height="50" rx="6"/>
          <rect x="-22" y="150" width="44" height="50" rx="6"/>
          <rect x="-200" y="-22" width="50" height="44" rx="6"/>
          <rect x="150" y="-22" width="50" height="44" rx="6"/>
        </g>
      </g>
    </g>

    <g clip-path="url(#bottomHalf)">
      <g fill="#f4d27a" stroke="#1a1a1a" stroke-width="8" stroke-linejoin="round">
        <g>
          <rect x="-22" y="-200" width="44" height="50" rx="6"/>
          <rect x="-22" y="150" width="44" height="50" rx="6"/>
          <rect x="-200" y="-22" width="50" height="44" rx="6"/>
          <rect x="150" y="-22" width="50" height="44" rx="6"/>
        </g>
        <g transform="rotate(45)">
          <rect x="-22" y="-200" width="44" height="50" rx="6"/>
          <rect x="-22" y="150" width="44" height="50" rx="6"/>
          <rect x="-200" y="-22" width="50" height="44" rx="6"/>
          <rect x="150" y="-22" width="50" height="44" rx="6"/>
        </g>
      </g>
    </g>

    <circle r="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="14"/>
    <circle r="30" fill="#1a1a1a"/>
    <circle r="14" fill="#ffffff"/>
  </g>
</svg>

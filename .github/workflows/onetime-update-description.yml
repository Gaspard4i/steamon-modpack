name: One-time update description

on:
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update project body on Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, urllib.request

          token = os.environ['MODRINTH_TOKEN']
          with open('.modrinth/body.md', encoding='utf-8') as f:
              body = f.read()

          payload = json.dumps({'body': body}).encode('utf-8')
          req = urllib.request.Request(
              'https://api.modrinth.com/v2/project/CR2XFGJ4',
              data=payload,
              method='PATCH',
              headers={
                  'Authorization': token,
                  'Content-Type': 'application/json',
                  'User-Agent': 'github.com/Gaspard4i/steamon-modpack',
              },
          )
          with urllib.request.urlopen(req) as r:
              print('PATCH body status:', r.status)
          PYEOF

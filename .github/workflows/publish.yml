name: Publish Modpack

on:
  push:
    tags:
      # Tag format: v<version>-<channel>-<variant>
      #   channel  = alpha | beta | release
      #   variant  = client | server
      # e.g. v0.3.0-alpha-client, v0.3.0-beta-server, v1.0.0-release-client
      - 'v*-client'
      - 'v*-server'
  workflow_dispatch:
    inputs:
      variant:
        description: 'client or server'
        required: true
        type: choice
        options: [client, server]
      version:
        description: 'Version (e.g. 0.3.0)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [alpha, beta, release]
        default: alpha

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect variant, version and channel
        id: meta
        run: |
          if [ -n "${{ inputs.variant }}" ]; then
            VARIANT="${{ inputs.variant }}"
            VERSION="${{ inputs.version }}"
            CHANNEL="${{ inputs.channel }}"
          else
            TAG="${GITHUB_REF_NAME}"        # e.g. v0.3.0-alpha-client
            if [[ "$TAG" == *-client ]]; then
              VARIANT=client; REST="${TAG%-client}"
            elif [[ "$TAG" == *-server ]]; then
              VARIANT=server; REST="${TAG%-server}"
            else
              echo "Tag does not end with -client or -server"; exit 1
            fi
            # REST = v<version>-<channel>  (channel optional, defaults to alpha)
            if [[ "$REST" == *-alpha ]]; then CHANNEL=alpha; VERSION="${REST#v}"; VERSION="${VERSION%-alpha}"
            elif [[ "$REST" == *-beta ]]; then CHANNEL=beta; VERSION="${REST#v}"; VERSION="${VERSION%-beta}"
            elif [[ "$REST" == *-release ]]; then CHANNEL=release; VERSION="${REST#v}"; VERSION="${VERSION%-release}"
            else CHANNEL=alpha; VERSION="${REST#v}"; fi
          fi
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          DISPLAY="$(echo "$VARIANT" | sed 's/.*/\u&/')"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "Detected: variant=$VARIANT version=$VERSION channel=$CHANNEL"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Bump pack version
        working-directory: ${{ steps.meta.outputs.variant }}
        run: |
          # Update pack.toml version line in-place
          sed -i "s/^version = \".*\"/version = \"${{ steps.meta.outputs.version }}\"/" pack.toml
          cat pack.toml

      - name: Refresh and export
        working-directory: ${{ steps.meta.outputs.variant }}
        run: |
          packwiz refresh
          packwiz modrinth export
          ls -la *.mrpack
          MRPACK="$(ls *.mrpack | head -1)"
          echo "MRPACK_PATH=${{ steps.meta.outputs.variant }}/$MRPACK" >> "$GITHUB_ENV"

      - name: Validate modpack (smoke test)
        run: |
          set -euo pipefail
          python3 - "$MRPACK_PATH" << 'PYEOF'
          import sys, json, zipfile, urllib.request, urllib.error, os
          path = sys.argv[1]
          print(f"[smoke] Validating {path}")
          if not os.path.exists(path):
              sys.exit(f"[FAIL] mrpack file missing: {path}")
          size = os.path.getsize(path)
          if size < 1000:
              sys.exit(f"[FAIL] mrpack suspiciously small: {size} bytes")
          print(f"[smoke] Size OK: {size} bytes")

          # 1. Zip integrity
          try:
              with zipfile.ZipFile(path) as z:
                  bad = z.testzip()
                  if bad:
                      sys.exit(f"[FAIL] Corrupt entry in zip: {bad}")
                  if 'modrinth.index.json' not in z.namelist():
                      sys.exit("[FAIL] modrinth.index.json missing from mrpack")
                  idx = json.loads(z.read('modrinth.index.json'))
          except zipfile.BadZipFile as e:
              sys.exit(f"[FAIL] Invalid zip: {e}")
          print(f"[smoke] Zip integrity OK")

          # 2. Manifest sanity
          if idx.get('formatVersion') != 1:
              sys.exit(f"[FAIL] Unexpected formatVersion: {idx.get('formatVersion')}")
          deps = idx.get('dependencies', {})
          mc = deps.get('minecraft')
          nf = deps.get('neoforge')
          if mc != '1.21.1':
              sys.exit(f"[FAIL] minecraft version mismatch: {mc}")
          if not nf:
              sys.exit("[FAIL] neoforge dependency missing in manifest")
          print(f"[smoke] Manifest OK: MC {mc}, NeoForge {nf}")

          # 3. All file downloads reachable (HEAD)
          files = idx.get('files', [])
          print(f"[smoke] Checking {len(files)} mod download URLs...")
          fails = []
          for i, f in enumerate(files, 1):
              urls = f.get('downloads', [])
              if not urls:
                  fails.append(f"{f.get('path','?')}: no download URL")
                  continue
              url = urls[0]
              try:
                  req = urllib.request.Request(url, method='HEAD', headers={'User-Agent': 'steamon-smoke/1.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      if r.status >= 400:
                          fails.append(f"{f['path']}: HTTP {r.status}")
              except urllib.error.HTTPError as e:
                  fails.append(f"{f['path']}: HTTP {e.code}")
              except Exception as e:
                  fails.append(f"{f['path']}: {e}")
              if i % 25 == 0:
                  print(f"  [{i}/{len(files)}] checked, {len(fails)} fails so far")
          if fails:
              print("[FAIL] Unreachable downloads:")
              for f in fails[:20]:
                  print(f"   - {f}")
              sys.exit(1)
          print(f"[smoke] All {len(files)} mod URLs reachable")

          # 4. modrinth.index.json: ensure no env conflict (mods must be required/unsupported, not both unsupported)
          for f in files:
              env = f.get('env', {})
              if env.get('client') == 'unsupported' and env.get('server') == 'unsupported':
                  sys.exit(f"[FAIL] {f['path']} marked unsupported on both sides")

          print("[smoke] All validation checks passed")
          PYEOF

      - name: Jar-level dependency check (boot-crash prevention)
        run: |
          set -euo pipefail
          python3 - "$MRPACK_PATH" << 'PYEOF'
          # Reads neoforge.mods.toml (+ jar-in-jar bundled mods) from every mod jar
          # in the mrpack and verifies all mandatory dependencies are present with a
          # satisfiable version. This catches boot crashes the URL check cannot:
          #   - missing libs not bundled (e.g. Resourceful Config, Lithostitched)
          #   - version mismatches (e.g. tim-core needing Cobblemon 1.8.0 vs 1.7.3)
          import sys, json, zipfile, io, urllib.request
          try:
              import tomllib
          except ModuleNotFoundError:
              import pip._vendor.tomli as tomllib  # py<3.11 fallback
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              idx = json.loads(z.read('modrinth.index.json'))

          def fetch(url):
              return urllib.request.urlopen(
                  urllib.request.Request(url, headers={'User-Agent': 'steamon-depcheck/1.0'}),
                  timeout=120).read()

          def read_meta(zf):
              for n in ('META-INF/neoforge.mods.toml', 'META-INF/mods.toml'):
                  if n in zf.namelist():
                      return tomllib.loads(zf.read(n).decode('utf-8', errors='replace'))
              return None

          installed = {'minecraft', 'neoforge', 'forge', 'java'}
          metas = []

          def ingest(jar_bytes, label):
              # Read a jar's mods.toml + recurse into jar-in-jar bundled mods
              try:
                  z = zipfile.ZipFile(io.BytesIO(jar_bytes))
              except Exception as e:
                  print(f"  [warn] {label}: {e}")
                  return
              m = read_meta(z)
              if m:
                  metas.append((label, m))
                  for md in m.get('mods', []):
                      installed.add(md['modId'])
              for n in z.namelist():
                  if n.startswith('META-INF/jarjar/') and n.endswith('.jar'):
                      try:
                          ingest(z.read(n), f"{label}::{n}")
                      except Exception:
                          pass

          # 1) Mods referenced by URL in modrinth.index.json (Modrinth mods)
          url_jars = [f for f in idx['files'] if f['path'].startswith('mods/') and f.get('downloads')]
          # 2) Mods embedded directly in the mrpack overrides (CurseForge mods, e.g. SuperMartijn642 libs)
          with zipfile.ZipFile(path) as mp:
              embedded = [n for n in mp.namelist()
                          if n.startswith(('overrides/mods/', 'client-overrides/mods/', 'server-overrides/mods/'))
                          and n.endswith('.jar')]
              print(f"[depcheck] Reading {len(url_jars)} URL mods + {len(embedded)} embedded mods...")
              for f in url_jars:
                  try:
                      ingest(fetch(f['downloads'][0]), f['path'])
                  except Exception as e:
                      print(f"  [warn] {f['path']}: {e}")
              for n in embedded:
                  try:
                      ingest(mp.read(n), n)
                  except Exception as e:
                      print(f"  [warn] {n}: {e}")

          problems = []
          for path_, m in metas:
              for owner, deplist in m.get('dependencies', {}).items():
                  for d in deplist:
                      if not d.get('mandatory', d.get('type', '') == 'required'):
                          continue
                      dep_id = d.get('modId')
                      if dep_id in ('forge', 'java', 'minecraft', 'neoforge'):
                          continue
                      if dep_id not in installed:
                          problems.append(f"{path_}: MISSING required '{dep_id}' {d.get('versionRange','')}")

          print(f"[depcheck] {len(installed)} modIds available (incl. jar-in-jar)")
          if problems:
              print(f"[FAIL] {len(problems)} unsatisfied required dependencies:")
              for p in problems:
                  print(f"   - {p}")
              sys.exit(1)
          print("[depcheck] All mandatory dependencies satisfied")
          PYEOF

      # Server variant: keep the GitHub artifact (fallback / direct .mrpack URL)
      # AND publish a non-featured version to Modrinth so the panel can target it
      # via MODRINTH_MODPACK for auto-sync.
      - name: Upload server artifact
        if: steps.meta.outputs.variant == 'server'
        uses: actions/upload-artifact@v4
        with:
          name: steamon-server-${{ steps.meta.outputs.version }}
          path: ${{ env.MRPACK_PATH }}
          retention-days: 90

      - name: Publish SERVER to Modrinth (non-featured)
        if: steps.meta.outputs.variant == 'server'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VARIANT: ${{ steps.meta.outputs.variant }}
          DISPLAY: ${{ steps.meta.outputs.display }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          MRPACK_FILE="$(basename "$MRPACK_PATH")"
          NAME="Steamon ${DISPLAY} ${VERSION} (${CHANNEL}) [server]"
          VERSION_NUMBER="${VERSION}-${CHANNEL}-${VARIANT}"
          echo "Uploading SERVER: $MRPACK_FILE  (version=$VERSION_NUMBER, channel=$CHANNEL)"
          TOKEN_LEN=${#MODRINTH_TOKEN}
          if [ "$TOKEN_LEN" -lt 32 ]; then
            echo "MODRINTH_TOKEN not set or too short — secret missing?"; exit 1
          fi

          DATA_JSON=$(VERSION_TYPE="$CHANNEL" python3 -c "
          import json, os
          print(json.dumps({
            'name': '$NAME',
            'version_number': '$VERSION_NUMBER',
            'project_id': 'CR2XFGJ4',
            'dependencies': [],
            'game_versions': ['1.21.1'],
            'version_type': os.environ['VERSION_TYPE'],
            'loaders': ['neoforge'],
            'featured': False,
            'status': 'listed',
            'file_parts': ['$MRPACK_FILE']
          }))")

          HTTP=$(curl -s -o /tmp/mr_resp_server.json -w "%{http_code}" \
            -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: github.com/Gaspard4i/steamon-modpack" \
            -F "data=${DATA_JSON};type=application/json" \
            -F "${MRPACK_FILE}=@${MRPACK_PATH};type=application/x-modrinth-modpack+zip")

          echo "HTTP: $HTTP"
          cat /tmp/mr_resp_server.json
          echo
          if [ "$HTTP" != "200" ]; then exit 1; fi
          SERVER_VERSION_ID="$(python3 -c "import json;print(json.load(open('/tmp/mr_resp_server.json'))['id'])")"
          echo "Server pack published — Modrinth version id: $SERVER_VERSION_ID"
          echo "::notice title=Server pack on Modrinth::version_id=$SERVER_VERSION_ID — set this in the panel (Modpack section) to enable auto-sync."

      - name: Publish CLIENT to Modrinth
        if: steps.meta.outputs.variant == 'client'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          VARIANT: ${{ steps.meta.outputs.variant }}
          DISPLAY: ${{ steps.meta.outputs.display }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          MRPACK_FILE="$(basename "$MRPACK_PATH")"
          NAME="Steamon ${DISPLAY} ${VERSION} (${CHANNEL})"
          VERSION_NUMBER="${VERSION}-${CHANNEL}-${VARIANT}"
          echo "Uploading: $MRPACK_FILE  (version=$VERSION_NUMBER, channel=$CHANNEL)"
          TOKEN_LEN=${#MODRINTH_TOKEN}
          echo "Token length: $TOKEN_LEN"
          if [ "$TOKEN_LEN" -lt 32 ]; then
            echo "MODRINTH_TOKEN not set or too short — secret missing?"; exit 1
          fi

          DATA_JSON=$(VERSION_TYPE="$CHANNEL" python3 -c "
          import json, os
          print(json.dumps({
            'name': '$NAME',
            'version_number': '$VERSION_NUMBER',
            'project_id': 'CR2XFGJ4',
            'dependencies': [],
            'game_versions': ['1.21.1'],
            'version_type': os.environ['VERSION_TYPE'],
            'loaders': ['neoforge'],
            'featured': False,
            'status': 'listed',
            'file_parts': ['$MRPACK_FILE']
          }))")
          echo "Payload: $DATA_JSON"

          HTTP=$(curl -s -o /tmp/mr_resp.json -w "%{http_code}" \
            -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: github.com/Gaspard4i/steamon-modpack" \
            -F "data=${DATA_JSON};type=application/json" \
            -F "${MRPACK_FILE}=@${MRPACK_PATH};type=application/x-modrinth-modpack+zip")

          echo "HTTP: $HTTP"
          cat /tmp/mr_resp.json
          echo
          if [ "$HTTP" != "200" ]; then exit 1; fi
          # Expose the published version id for the Discord step
          VERSION_ID="$(python3 -c "import json;print(json.load(open('/tmp/mr_resp.json'))['id'])")"
          echo "MR_VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"

      - name: Announce on Discord (#changelog)
        if: steps.meta.outputs.variant == 'client' && env.MR_VERSION_ID != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "No DISCORD_CHANGELOG_WEBHOOK secret — skipping Discord announce"; exit 0
          fi
          python3 << 'PYEOF'
          import os, json, urllib.request
          version = os.environ['VERSION']
          channel = os.environ['CHANNEL']
          mr_url = f"https://modrinth.com/modpack/steamon/version/{version}-{channel}-client"
          color = {'release': 0x57F287, 'beta': 0xFEE75C, 'alpha': 0xED4245}.get(channel, 0xC8B48C)
          ping_role = '1507416018912284733'  # Modpack Update Pings
          payload = {
            'username': 'Steamon Modpack Changelog',
            'content': f"<@&{ping_role}> Steamon **{version}** ({channel}) is out!",
            'allowed_mentions': {'roles': [ping_role]},
            'embeds': [{
              'title': f"Steamon {version} ({channel}) is out",
              'url': mr_url,
              'description': f"A new {channel} build of the Steamon modpack has been published.\n\n[**View changelog & download on Modrinth**]({mr_url})",
              'color': color,
              'footer': {'text': 'Create x Cobblemon - 1.21.1 NeoForge'},
            }],
          }
          req = urllib.request.Request(
            os.environ['WEBHOOK'], data=json.dumps(payload).encode(),
            headers={'Content-Type': 'application/json', 'User-Agent': 'steamon-ci/1.0'}, method='POST')
          with urllib.request.urlopen(req) as r:
            print('Discord webhook HTTP', r.status)
          PYEOF
